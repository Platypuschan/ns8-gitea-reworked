name: Publish tested catalog version

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check catalog version
        run: .github/scripts/check-catalog-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Promote the tested image once
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_sha" != "$TESTED_SHA" ]]; then
            echo 'A newer main commit exists; its test run will publish the version.'
            exit 0
          fi

          tested_image="$(sed -n 's/^IMAGE=//p' tested-image.env)"
          tested_digest="$(sed -n 's/^DIGEST=//p' tested-image.env)"
          tested_commit="$(sed -n 's/^SHA=//p' tested-image.env)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitea-reworked"
          if [[ "$tested_commit" != "$TESTED_SHA" || "$tested_image" != "$image" ||
                ! "$tested_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected tested image record: $(tr '\n' ' ' < tested-image.env)" >&2
            exit 1
          fi

          version="$(tr -d '[:space:]' < CATALOG_VERSION)"
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          if published="$(skopeo inspect --format '{{.Digest}}' "docker://$image:$version" 2>/dev/null)"; then
            # The version check above passed, so only files outside the image
            # changed since CATALOG_VERSION was set.
            echo "::notice::$image:$version already exists ($published); no module image change since that release."
            exit 0
          fi

          printf '%s' "$REGISTRY_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests "docker://$image@$tested_digest" "docker://$image:$version"
          published="$(skopeo inspect --format '{{.Digest}}' "docker://$image:$version")"
          if [[ "$published" != "$tested_digest" ]]; then
            echo "::error::$image:$version has digest $published, expected $tested_digest" >&2
            exit 1
          fi
          echo "Published $image:$version ($tested_digest) from tested commit $TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release of the published version
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < CATALOG_VERSION)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitea-reworked"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists."
            exit 0
          fi

          command -v skopeo >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y skopeo; }
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          if ! inspect="$(skopeo inspect "docker://$image:$version" 2>&1)"; then
            if grep -q 'manifest unknown' <<<"$inspect"; then
              # A newer main commit exists; its run publishes the version.
              echo "$image:$version is not published yet; no release."
              exit 0
            fi
            echo "$inspect" >&2
            exit 1
          fi
          # The image has no revision label. Tag the tested main commit: the
          # version check above keeps the image unchanged since CATALOG_VERSION
          # was set. GITHUB_TOKEN gets HTTP 403 when the tagged commit's
          # workflow files match no existing ref, as with the older commit
          # that set the version; the main tip always matches refs/heads/main.
          if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$TESTED_SHA" ]]; then
            echo "A newer main commit exists; its run creates the release."
            exit 0
          fi
          revision="$TESTED_SHA"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$revision" "$TESTED_SHA"; then
            echo "$image:$version has revision '$revision', which is not on main; no release." >&2
            exit 1
          fi
          # An annotated tag is listed twice; its peeled "^{}" line comes last.
          tag_sha="$(git ls-remote --tags origin "refs/tags/$version" \
            | awk -v ref="refs/tags/$version" '$2 == ref || $2 == ref "^{}" { sha = $1 } END { print sha }')"
          if [[ -n "$tag_sha" && "$tag_sha" != "$revision" ]]; then
            echo "Tag $version points to $tag_sha, but $image:$version was built from $revision." >&2
            exit 1
          fi

          args=(--target "$revision" --title "$version" --generate-notes)
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "$previous" ]]; then
            args+=(--notes-start-tag "$previous")
          fi
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          # A tag created with GITHUB_TOKEN triggers no workflow, so this does
          # not rebuild the image; publish-images also skips existing tags.
          gh release create "$version" "${args[@]}"
          echo "Created release $version at $revision" >> "$GITHUB_STEP_SUMMARY"
