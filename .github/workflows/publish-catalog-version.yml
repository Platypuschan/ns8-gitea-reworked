name: Publish tested catalog version

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check catalog version
        run: .github/scripts/check-catalog-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Promote the tested image once
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_sha" != "$TESTED_SHA" ]]; then
            echo 'A newer main commit exists; its test run will publish the version.'
            exit 0
          fi

          tested_image="$(sed -n 's/^IMAGE=//p' tested-image.env)"
          tested_digest="$(sed -n 's/^DIGEST=//p' tested-image.env)"
          tested_commit="$(sed -n 's/^SHA=//p' tested-image.env)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitea-reworked"
          if [[ "$tested_commit" != "$TESTED_SHA" || "$tested_image" != "$image" ||
                ! "$tested_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected tested image record: $(tr '\n' ' ' < tested-image.env)" >&2
            exit 1
          fi

          version="$(tr -d '[:space:]' < CATALOG_VERSION)"
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          if published="$(skopeo inspect --format '{{.Digest}}' "docker://$image:$version" 2>/dev/null)"; then
            # The version check above passed, so only files outside the image
            # changed since CATALOG_VERSION was set.
            echo "::notice::$image:$version already exists ($published); no module image change since that release."
            exit 0
          fi

          printf '%s' "$REGISTRY_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests "docker://$image@$tested_digest" "docker://$image:$version"
          published="$(skopeo inspect --format '{{.Digest}}' "docker://$image:$version")"
          if [[ "$published" != "$tested_digest" ]]; then
            echo "::error::$image:$version has digest $published, expected $tested_digest" >&2
            exit 1
          fi
          echo "Published $image:$version ($tested_digest) from tested commit $TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
