name: "Clean up API JSON Schema docs"

on:
  delete:

# The reusable workflow deletes the apidoc-<branch> branch; the repository
# token defaults to read-only, so grant write access explicitly.
permissions:
  contents: write

jobs:
  build-apidoc:
    name: "Delete apidoc branch ${{ github.event.ref }}"
    uses: NethServer/ns8-github-actions/.github/workflows/clean-apidoc.yml@1f7be3c6e4791a978df9c0a0454e9a8fea8d211a # v1
